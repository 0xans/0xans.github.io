<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse and search research notes by Anas.">
    <title>Writing | 0xAns</title>
    <link rel="icon" href="assets/includes/favicon.ico?v=carbon" sizes="16x16 32x32 48x48" type="image/x-icon">
    <link rel="icon" href="assets/images/logo.svg" sizes="any" type="image/svg+xml">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#161616">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/site.js" defer></script>
</head>
<body data-page="articles">
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
        <div class="container masthead-inner">
            <a class="brand" href="index.html" aria-label="0xAns home"><img class="mark" src="assets/images/logo.svg" width="32" height="32" alt="">0xAns</a>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="articles.html" aria-current="page">Writing</a>
                <a href="index.html#projects">Projects</a>
            </nav>
        </div>
    </header>
    <main id="main" class="container archive">
        <div class="reader-tools"><button class="library-toggle" id="library-toggle" type="button" aria-controls="library-panel" aria-expanded="false"><span class="rail-icon" aria-hidden="true"></span>Article library</button></div>
        <div class="library-layout">
            <aside id="library-panel" class="library-panel" aria-label="Article library" hidden>
                <h2>All articles</h2>
                <label class="visually-hidden" for="library-search">Find an article in the library</label>
                <input type="search" id="library-search" placeholder="Find an article…" autocomplete="off">
                <nav id="library-groups" aria-label="Articles by topic"></nav>
            </aside>
            <div class="archive-content">
                <header class="archive-heading"><h1>My notes<span>.</span></h1></header>
                <div class="archive-tools">
                    <div class="search-box"><label for="search-bar">Search articles</label><input id="search-bar" type="search" placeholder="Title, topic, or keyword" autocomplete="off"></div>
                    <div id="category-filters" class="filters" role="group" aria-label="Filter by category"></div>
                </div>
                <p id="result-count" class="meta" role="status"></p>
                <div id="all-articles" data-load-error></div>
            </div>
        </div>
    </main>
    <footer class="container site-footer"><span>Anas <span aria-hidden="true">/</span> 0xAns</span><a data-profile-github href="https://github.com/0xans">GitHub</a></footer>
</body>
</html>
