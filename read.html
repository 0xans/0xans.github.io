<!DOCTYPE html>
<html lang="en" data-theme="rose">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read technical security research from 0xAns.">
    <title>Reader | 0xAns</title>
    <link rel="icon" href="assets/includes/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem("0xans-theme") || "rose";
        } catch (_) {
            document.documentElement.dataset.theme = "rose";
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="reader-body" data-page="reader">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div class="reader-shell">
        <aside id="reader-sidebar" class="reader-sidebar" aria-label="Article library">
            <div class="reader-brandbar">
                <a class="brand" href="index.html" aria-label="0xAns home">
                    <span class="brand-mark">0x</span>
                    <span>0xAns<span style="color: var(--subtle)">.reader</span></span>
                </a>
                <button id="sidebar-close" class="icon-button mobile-only" type="button" aria-label="Close article library">
                    <i class="ph ph-x" aria-hidden="true"></i>
                </button>
            </div>

            <div class="reader-sidebar-search">
                <div class="search-row">
                    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                    <input id="reader-search" class="search-input" type="search" placeholder="Search library..." autocomplete="off">
                </div>
            </div>

            <div id="reader-list" class="reader-sidebar-body scroll-area"></div>

            <div class="reader-sidebar-foot">
                <a class="button ghost" data-profile-github href="https://github.com/0xans" target="_blank" rel="noreferrer">
                    <i class="ph ph-github-logo" aria-hidden="true"></i>
                    GitHub
                </a>
                <a class="button ghost" href="articles.html">
                    <i class="ph ph-newspaper" aria-hidden="true"></i>
                    Articles
                </a>
            </div>
        </aside>

        <main class="reader-main">
            <header class="reader-topbar">
                <div class="reader-titleline">
                    <button id="mobile-menu" class="icon-button mobile-only" type="button" aria-label="Open article library">
                        <i class="ph ph-list" aria-hidden="true"></i>
                    </button>
                    <span>/</span>
                    <span id="crumb-title">Library</span>
                </div>

                <div class="reader-toolbar">
                    <div class="theme-switch" aria-label="Color theme">
                        <button type="button" data-theme-option="rose">Rose</button>
                        <button type="button" data-theme-option="dark">Dark</button>
                        <button type="button" data-theme-option="light">Light</button>
                    </div>
                    <button id="wide-toggle" class="icon-button" type="button" aria-label="Toggle reader width">
                        <i class="ph ph-arrows-out-line-horizontal" aria-hidden="true"></i>
                    </button>
                    <div class="settings-wrap">
                        <button id="settings-btn" class="icon-button" type="button" aria-label="Reader settings">
                            <i class="ph ph-gear-six" aria-hidden="true"></i>
                        </button>
                        <div id="settings-menu" class="settings-menu">
                            <label class="settings-label">Font size</label>
                            <div class="stepper">
                                <button type="button" data-font-step="-10" aria-label="Decrease font size"><i class="ph ph-minus" aria-hidden="true"></i></button>
                                <span id="font-size-display">100%</span>
                                <button type="button" data-font-step="10" aria-label="Increase font size"><i class="ph ph-plus" aria-hidden="true"></i></button>
                            </div>

                            <label class="settings-label">Typeface</label>
                            <div class="choice-row">
                                <button type="button" data-font-mode="sans">Sans</button>
                                <button type="button" data-font-mode="serif">Serif</button>
                            </div>
                        </div>
                    </div>
                    <a class="icon-button" href="index.html" aria-label="Home">
                        <i class="ph ph-house" aria-hidden="true"></i>
                    </a>
                </div>
            </header>

            <div class="reader-content">
                <div class="reader-scroll">
                    <div id="article-wrap" class="article-wrap">
                        <div id="loading" class="loading-state">
                            <div>
                                <i class="ph ph-spinner-gap" aria-hidden="true"></i>
                                <p>Fetching document...</p>
                            </div>
                        </div>

                        <article id="reader-article" class="hide">
                            <img id="article-cover" class="reader-article-cover hide" src="" alt="">
                            <header class="article-header">
                                <div class="article-meta">
                                    <span id="article-date"></span>
                                    <span id="read-time">...</span>
                                    <span id="article-category"></span>
                                </div>
                                <h1 id="article-title"></h1>
                                <div id="article-tags" class="tag-row"></div>
                            </header>
                            <div id="markdown-body" class="article-content"></div>
                        </article>
                    </div>
                </div>

                <aside id="reader-toc" class="reader-toc" aria-label="Table of contents">
                    <div class="toc-box">
                        <p class="toc-title">On this page</p>
                        <nav id="toc-nav"></nav>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="assets/js/site.js"></script>
</body>
</html>
