<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Security research and field notes by Anas.">
    <title>Reader | 0xAns</title>
    <link rel="icon" href="assets/includes/favicon.ico?v=carbon" sizes="16x16 32x32 48x48" type="image/x-icon">
    <link rel="icon" href="assets/images/logo.svg" sizes="any" type="image/svg+xml">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#161616">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/site.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body data-page="reader">
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
        <div class="container masthead-inner">
            <a class="brand" href="index.html" aria-label="0xAns home"><img class="mark" src="assets/images/logo.svg" width="32" height="32" alt="">0xAns</a>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="articles.html">Writing</a>
                <a href="index.html#projects">Projects</a>
            </nav>
        </div>
    </header>
    <main id="main" class="container reader">
        <div class="reader-tools">
            <button class="library-toggle" id="library-toggle" type="button" aria-controls="library-panel" aria-expanded="false"><span class="rail-icon" aria-hidden="true"></span>Article library</button>
            <details class="settings">
                <summary><span aria-hidden="true">Aa</span> Reading settings</summary>
                <form class="popover" id="reading-settings">
                    <div class="settings-head"><h2>Reading settings</h2><button type="reset">Reset</button></div>
                    <label for="typeface">Typeface</label>
                    <select id="typeface"><option value="sans">Sans serif</option><option value="serif">Book serif</option><option value="mono">Monospace</option></select>
                    <label for="text-size">Text size <output for="text-size" id="size-value"></output></label>
                    <input id="text-size" type="range" min="80" max="150" step="5">
                    <label for="line-height">Line spacing <output for="line-height" id="leading-value"></output></label>
                    <input id="line-height" type="range" min="140" max="210" step="5">
                    <label for="line-width">Line width</label>
                    <select id="line-width"><option value="narrow">Narrow</option><option value="standard">Standard</option><option value="wide">Wide</option></select>
                </form>
            </details>
        </div>
        <div class="library-layout">
            <aside id="library-panel" class="library-panel" aria-label="Article library" hidden>
                <h2>All articles</h2>
                <label class="visually-hidden" for="library-search">Find an article in the library</label>
                <input type="search" id="library-search" placeholder="Find an article…" autocomplete="off">
                <nav id="library-groups" aria-label="Articles by topic"></nav>
            </aside>
            <div class="reader-column">
                <p id="loading" role="status" data-load-error>Loading article…</p>
                <article id="reader-article" class="hide">
                    <div class="reader-hero">
                        <header class="article-header">
                            <div class="meta"><span id="article-category"></span><span id="article-date"></span><span id="read-time"></span></div>
                            <h1 id="article-title"></h1>
                            <p id="article-subtitle" class="hide"></p>
                            <div id="article-tags" class="tag-row"></div>
                        </header>
                        <img id="article-cover" class="reader-cover hide" alt="">
                    </div>
                    <details id="reader-toc" class="hide"><summary>On this page</summary><nav id="toc-nav" aria-label="On this page"></nav></details>
                    <div id="markdown-body" class="article-content"></div>
                </article>
            </div>
        </div>
    </main>
    <footer class="container site-footer"><span>Anas <span aria-hidden="true">/</span> 0xAns</span><a data-profile-github href="https://github.com/0xans">GitHub</a></footer>
</body>
</html>
